name: Deploy AI Ops Assistant UI

on:
  push:
    branches:
      - master
    paths:
      - "ops-assistant-ui/**"
      - ".github/workflows/ops-assistant-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

# Skip entire workflow if commit message contains [skip ci] or [ci skip]
# Allows tearing down infrastructure without triggering rebuild
# Example: git commit -m "chore: tear down infra [skip ci]"
if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_ASSISTANT_API_URL: ${{ vars.VITE_ASSISTANT_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ops-assistant-ui
          api_location: ""
          output_location: dist
