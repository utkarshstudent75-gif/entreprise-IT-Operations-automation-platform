name: Enterprise IT Operations Automation Platform CI

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master
      - 'feature/**'
  workflow_dispatch:

concurrency: 
  group: ci-${{ github.workflow }}-${{github.ref}}
  cancel-in-progress: true

jobs:
    backend:
        permissions:
            contents: read
        timeout-minutes: 20
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: ${{ vars.PS_USER || 'postgres' }}
                    POSTGRES_PASSWORD: ${{ vars.PS_PWD || 'postgres' }}
                    POSTGRES_DB: ${{ vars.DB_NAME || 'eitoap' }}
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            APP_NAME: ${{ vars.APP_NAME || 'Enterprise IT Operations Automation Platform' }}
            APP_VERSION: ${{ vars.APP_VERSION || '0.1.0' }}
            ENVIRONMENT: ci
            DEBUG: ${{ vars.DEBUG || 'true' }}
            HOST: ${{ vars.HOST || '0.0.0.0' }}
            PORT: ${{ vars.PORT || '8000' }}
            OTP_LENGTH: ${{ vars.OTP_LENGTH || '6' }}
            OTP_EXPIRY_MINUTES: ${{ vars.OTP_EXPIRY_MINUTES || '5' }}
            OTP_MAX_ATTEMPTS: ${{ vars.OTP_MAX_ATTEMPTS || '3' }}
            DATABASE_URL: postgresql://${{ vars.PS_USER || 'postgres' }}:${{ vars.PS_PWD || 'postgres' }}@localhost:5432/${{ vars.DB_NAME || 'eitoap' }}
            REDIS_URL: redis://localhost:6379/0
            REDIS_HOST: localhost
            REDIS_PORT: 6379
            REDIS_DB: 0
            REDIS_PASSWORD: ""
            JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
            JWT_ALGORITHM: HS256
            JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
            NOTIFICATION_PROVIDER: console
            AUTH_PROVIDER: local
            # SMS Mock Provider (od2.in) — used by live integration tests only
            SMS_BASE_URL: ${{ secrets.SMS_BASE_URL || 'https://od2.in/api/sms' }}
            SMS_ACCOUNT_SID: ${{ secrets.SMS_ACCOUNT_SID }}
            SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
            SMS_SENDER_ID: ${{ secrets.SMS_SENDER_ID || '+15551234567' }}
            SMS_TEST_RECIPIENT: ${{ secrets.SMS_TEST_RECIPIENT || '+18005550199' }}
            LIVE_SMS_TEST_ENABLED: ${{ secrets.SMS_ACCOUNT_SID != '' && 'true' || 'false' }}

        
        name: Backend Build
    
        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout_code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: backend/requirements-test.txt
                  
            - name: Install dependencies
              run: |
                python -m pip install pip==26.1.2
                pip install --only-binary :all: --require-hashes -r requirements-test.txt
                
            
            - name: Run Ruff
              run: |
                    ruff check .    
      
            - name: Check Formattting
              run: |
                    black --check .
           
            - name: Check Import Order (isort)
              run: |
                    isort --check .

            - name: Run Bandit Security scan
              run: |
                    bandit -r app -f json -o bandit-report.json
               
            - name: Verify Service Connectivity (Postgres & Redis)
              run: |
                    PYTHONPATH=. python scripts/wait_for_services.py

            - name: Run Backend tests (pytest)
              run: |
                    pytest --junitxml=junit.xml --ignore=tests/integration/test_sms_integration.py

            - name: Run Live SMS Integration Tests (od2.in mock provider)
              if: ${{ env.SMS_ACCOUNT_SID != '' }}
              run: |
                    pytest tests/integration/test_sms_integration.py -v --junitxml=junit-sms.xml

            - name: Validate FastAPI app
              run: |
                python -c "from app.main import app"

            - name: Upload Pytest JUnit XML Report
              uses: actions/upload-artifact@v4
              with:
                name: pytest-junit-xml
                path: backend/junit.xml
              if: always()

            - name: Upload SMS Integration Test JUnit XML Report
              uses: actions/upload-artifact@v4
              with:
                name: pytest-sms-junit-xml
                path: backend/junit-sms.xml
              if: always()

            - name: Upload Coverage XML Report
              uses: actions/upload-artifact@v4
              with:
                name: coverage-xml
                path: backend/coverage/coverage.xml
              if: always()

            - name: Upload Coverage HTML Report
              uses: actions/upload-artifact@v4
              with:
                name: coverage-html
                path: backend/coverage/html/
              if: always()

            - name: Upload Bandit Report
              uses: actions/upload-artifact@v4
              with:
                name: bandit-report
                path: backend/bandit-report.json
              if: always()

    frontend:
        permissions:
            contents: read
        name: Frontend Build
        timeout-minutes: 20
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend
            
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22" 
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
             
            - name: Install dependencies
              run: npm ci --ignore-scripts --legacy-peer-deps

            - name: Audit frontend dependencies
              run: npm audit --audit-level=high
              continue-on-error: true

            - name: Run ESLint
              run: npm run lint

            - name: TypeScript validation
              run: npx tsc --noEmit

            - name: Build react app
              run: npm run build

    Semgrep:
        permissions:
            contents: read
        name: Semgrep security scan
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
            
        needs:
            - backend
            - frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run Semgrep Scan
              run: semgrep ci
              env:
                  SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    helm:
        permissions:
            contents: read
        name: Helm Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Helm
              uses: azure/setup-helm@v4
              with:
                version: 'v3.14.0'

            - name: Lint Helm Charts
              run: |
                helm lint deploy/helm/common
                helm lint deploy/helm/backend
                helm lint deploy/helm/frontend

            - name: Template Helm Charts (Dry Run)
              run: |
                helm template common deploy/helm/common -f deploy/helm/values/dev.yaml
                helm template backend deploy/helm/backend -f deploy/helm/values/dev.yaml
                helm template frontend deploy/helm/frontend -f deploy/helm/values/dev.yaml

    terraform:
        permissions:
            contents: read
        name: Terraform Validation
        runs-on: ubuntu-latest
        env:
            TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: 1.9.0

            - name: Create Terraform plugin cache directory
              run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

            - name: Cache Terraform providers
              uses: actions/cache@v4
              with:
                path: ${{ env.TF_PLUGIN_CACHE_DIR }}
                key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
                restore-keys: |
                  terraform-providers-${{ runner.os }}-

            - name: Format Check
              run: terraform fmt -check -recursive infrastructure/terraform

            - name: Init and Validate Dev
              run: |
                cd infrastructure/terraform/environments/dev
                terraform init -backend=false -upgrade
                terraform validate

            - name: Init and Validate Prod
              run: |
                cd infrastructure/terraform/environments/prod
                terraform init -backend=false -upgrade
                terraform validate

    docker:
        permissions:
            contents: read
            id-token: write
        name: Docker build
        runs-on: ubuntu-latest
        needs:
            - backend
            - frontend
            - Semgrep
            - helm
            - terraform
        
        steps:
        
          # steps for checkout
            - name: Checkout repository
              uses: actions/checkout@v4


          #setting up docker buildx ( latest engine )
            - name: Setup up Docker buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f


          #Docker metadata setup
            - name: Docker metadata (Back-end)
              id: backend-meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
              with:
                images: entreprise-backend
                tags: |
                  type=raw,value=latest
                  type=ref,event=branch
                  type=sha


            #building back-end image
            - name: Build back-end image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
              with: 
                context: ./backend
                push: false
                load: true
                tags: ${{ steps.backend-meta.outputs.tags }}
                labels: ${{ steps.backend-meta.outputs.labels}}
                cache-from: type=gha
                cache-to: type=gha,mode=max

            - name: Docker metadata (Front-end)
              id: frontend-meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
              with:
                images: entreprise-frontend
                tags: |
                  type=raw,value=latest
                  type=ref,event=branch
                  type=sha
            
            
            
            #building front-end image
            - name: Build front-end image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
              with: 
                context: ./frontend
                push: false
                load: true
                tags: ${{steps.frontend-meta.outputs.tags}}
                labels: ${{steps.frontend-meta.outputs.labels}}
                cache-from: type=gha
                cache-to: type=gha,mode=max


            - name: Azure Login
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Log in to Azure Container Registry
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              run: |
                az acr login --name ${{ vars.ACR_NAME || 'enterpriseitoperationsplatformdev1bab46e1' }}

            - name: Tag and Push images to ACR
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              run: |
                REGISTRY="${{ vars.ACR_LOGIN_SERVER || 'enterpriseitoperationsplatformdev1bab46e1.azurecr.io' }}"
                
                # Tag and Push Backend
                docker tag entreprise-backend:latest $REGISTRY/backend:latest
                docker tag entreprise-backend:latest $REGISTRY/backend:${{ github.sha }}
                docker push $REGISTRY/backend:latest
                docker push $REGISTRY/backend:${{ github.sha }}
                
                # Tag and Push Frontend
                docker tag entreprise-frontend:latest $REGISTRY/frontend:latest
                docker tag entreprise-frontend:latest $REGISTRY/frontend:${{ github.sha }}
                docker push $REGISTRY/frontend:latest
                docker push $REGISTRY/frontend:${{ github.sha }}

            - name: Save backend image
              run: |
               docker save \
                -o backend-image.tar \
                entreprise-backend:latest
              

            - name: Save frontend image
              run: |
               docker save \
               -o frontend-image.tar \
               entreprise-frontend:latest 

            - name: Upload back-end image
              uses: actions/upload-artifact@v4
              with: 
                name: backend-image
                path: backend-image.tar
                retention-days: 7

            - name: upload front-end image
              uses: actions/upload-artifact@v4
              with:
                name: frontend-image
                path: frontend-image.tar
                retention-days: 7

    sign:
      permissions:
        contents: read
        id-token: write
      name: Cosign Image Signing
      runs-on: ubuntu-latest
      needs: docker
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        # The COSIGN_PRIVATE_KEY secret is not configured yet; skip signing
        # instead of failing the pipeline until it is added.
        - name: Check signing key
          id: signing-key
          env:
            COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          run: |
            if [ -n "$COSIGN_PRIVATE_KEY" ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Cosign Image Signing::COSIGN_PRIVATE_KEY secret is not set - skipping image signing"
            fi

        - name: Azure Login
          if: steps.signing-key.outputs.available == 'true'
          uses: azure/login@v2
          with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        - name: Log in to Azure Container Registry
          if: steps.signing-key.outputs.available == 'true'
          run: |
            az acr login --name ${{ vars.ACR_NAME || 'enterpriseitoperationsplatformdev1bab46e1' }}

        - name: Install Cosign
          if: steps.signing-key.outputs.available == 'true'
          run: |
            curl -sLO https://github.com/sigstore/cosign/releases/download/v2.2.2/cosign-linux-amd64
            chmod +x cosign-linux-amd64
            sudo mv cosign-linux-amd64 /usr/local/bin/cosign

        # Accepts COSIGN_PRIVATE_KEY stored as either base64 or raw PEM.
        - name: Prepare cosign key
          if: steps.signing-key.outputs.available == 'true'
          env:
            COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          run: |
            printf '%s' "$COSIGN_PRIVATE_KEY" | base64 -d > cosign.key 2>/dev/null || true
            if ! grep -q "PRIVATE KEY" cosign.key; then
              printf '%s\n' "$COSIGN_PRIVATE_KEY" > cosign.key
            fi
            chmod 600 cosign.key
            if ! grep -q "PRIVATE KEY" cosign.key; then
              echo "::error::COSIGN_PRIVATE_KEY is neither valid base64 nor a PEM private key"
              exit 1
            fi

        - name: Sign Backend Image
          if: steps.signing-key.outputs.available == 'true'
          env:
            COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          run: |
            cosign sign --key cosign.key --output-signature backend.sig \
              ${{ vars.ACR_LOGIN_SERVER || 'enterpriseitoperationsplatformdev1bab46e1.azurecr.io' }}/backend:${{ github.sha }}

        - name: Sign Frontend Image
          if: steps.signing-key.outputs.available == 'true'
          env:
            COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          run: |
            cosign sign --key cosign.key --output-signature frontend.sig \
              ${{ vars.ACR_LOGIN_SERVER || 'enterpriseitoperationsplatformdev1bab46e1.azurecr.io' }}/frontend:${{ github.sha }}

        - name: Upload Backend Signature
          if: steps.signing-key.outputs.available == 'true'
          uses: actions/upload-artifact@v4
          with:
            name: backend-signature
            path: backend.sig
            retention-days: 30
            if-no-files-found: error

        - name: Upload Frontend Signature
          if: steps.signing-key.outputs.available == 'true'
          uses: actions/upload-artifact@v4
          with:
            name: frontend-signature
            path: frontend.sig
            retention-days: 30
            if-no-files-found: error

        - name: Clean up cosign key
          if: always() && steps.signing-key.outputs.available == 'true'
          run: rm -f cosign.key

    trivy:
        permissions:
            contents: read
            security-events: write
            id-token: write
        name: Trivy security scan
        needs: docker
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Trivy Filesystem Scan (Vulnerabilities & Secrets)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with:
                scan-type: 'fs'
                scan-ref: '.'
                format: 'table'
                exit-code: 1
                ignore-unfixed: true
                severity: 'CRITICAL'

            #download .tar artifacts 
            - name: Download back-end image
              uses: actions/download-artifact@v4 
              with: 
                name: backend-image
            
            - name: Download front-end image
              uses: actions/download-artifact@v4
              with: 
                name: frontend-image

            #Load docker images for trivy
            - name: Load back-end image
              run: docker load -i backend-image.tar

            - name: Load front-end image
              run: docker load -i frontend-image.tar

            - name: verify images
              run: docker images

            #scan Backend image in trivy    
            - name: Scan backend image (HIGH & CRITICAL Report)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with:
                image-ref: entreprise-backend:latest
                format: sarif
                output: backend-trivy-results.sarif
                exit-code: 0
                ignore-unfixed: true
                vuln-type: os,library
                severity: HIGH,CRITICAL

            # Scan frontend image in trivy
            - name: Scan frontend image (HIGH & CRITICAL Report)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with:
                image-ref: entreprise-frontend:latest
                format: sarif
                output: frontend-trivy-results.sarif
                exit-code: 0
                ignore-unfixed: true
                vuln-type: os,library
                severity: HIGH,CRITICAL

            # Scan images to fail on CRITICAL
            - name: Fail backend image on Critical vulnerability
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with:
                image-ref: entreprise-backend:latest
                format: table
                exit-code: 1
                ignore-unfixed: true
                vuln-type: os,library
                severity: CRITICAL

            - name: Fail frontend image on Critical vulnerability
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with:
                image-ref: entreprise-frontend:latest
                format: table
                exit-code: 1
                ignore-unfixed: true
                vuln-type: os,library
                severity: CRITICAL

            # Upload the backend sarif
            - name: Upload backend SARIF
              uses: github/codeql-action/upload-sarif@v4
              continue-on-error: true
              with:
                sarif_file: backend-trivy-results.sarif
                category: backend-trivy

            - name: Upload frontend SARIF
              uses: github/codeql-action/upload-sarif@v4
              continue-on-error: true
              with:
                sarif_file: frontend-trivy-results.sarif
                category: frontend-trivy
                
            #Generate Backend SBOM
            - name: Generate Backend SBOM
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with:
                image-ref: entreprise-backend:latest
                format: cyclonedx
                output: backend-sbom.json
                scanners: vuln
              
            #Generate Frontend SBOM     
            - name: Generate Frontend SBOM
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with: 
                image-ref: entreprise-frontend:latest
                format: cyclonedx
                output: frontend-sbom.json
                scanners: vuln

            #Upload Backend SBOM
            - name: Upload Backend SBOM
              uses: actions/upload-artifact@v4
              with: 
                name: backend-sbom
                path: backend-sbom.json
                retention-days: 30

            #Upload Frontend SBOM
            - name: Upload Frontend SBOM
              uses: actions/upload-artifact@v4
              with: 
                name: frontend-sbom
                path: frontend-sbom.json
                retention-days: 30

            - name: Upload Trivy SARIF Reports
              uses: actions/upload-artifact@v4
              with:
                name: trivy-sarif-reports
                path: |
                  backend-trivy-results.sarif
                  frontend-trivy-results.sarif
              if: always()

    deploy:
        permissions:
            contents: read
            id-token: write
        name: Deploy to AKS
        runs-on: ubuntu-latest
        needs:
            - backend
            - frontend
            - Semgrep
            - helm
            - terraform
            - docker
            - trivy
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Helm
              uses: azure/setup-helm@v4
              with:
                version: 'v3.14.0'

            - name: Azure Login
              uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Install kubelogin
              # azure/aks-set-context writes a kubeconfig that uses kubelogin as
              # its exec credential plugin; it is not preinstalled on the runner.
              run: |
                curl -sSL -o /tmp/kubelogin.zip https://github.com/Azure/kubelogin/releases/download/v0.2.20/kubelogin-linux-amd64.zip
                unzip -oq /tmp/kubelogin.zip -d /tmp/kubelogin
                sudo install -m 0755 /tmp/kubelogin/bin/linux_amd64/kubelogin /usr/local/bin/kubelogin
                kubelogin --version

            - name: Set AKS Context
              uses: azure/aks-set-context@v4
              with:
                resource-group: 'enterprise-it-operations-platform-dev-rg'
                cluster-name: 'enterprise-dev-aks'

            - name: Deploy Common Chart
              run: |
                helm upgrade --install common deploy/helm/common \
                  -f deploy/helm/values/dev.yaml \
                  -n database --create-namespace

            - name: Deploy Backend Chart
              run: |
                helm upgrade --install backend deploy/helm/backend \
                  -f deploy/helm/values/dev.yaml \
                  --set image.tag=${{ github.sha }} \
                  -n backend --create-namespace

            - name: Deploy Frontend Chart
              run: |
                helm upgrade --install frontend deploy/helm/frontend \
                  -f deploy/helm/values/dev.yaml \
                  --set image.repository=enterpriseitoperationsplatformdev1bab46e1.azurecr.io/frontend \
                  --set image.tag=${{ github.sha }} \
                  -n frontend --create-namespace

            - name: Post-Deployment Validation
              run: |
                echo "Validating deployments rollout..."
                kubectl rollout status deployment/backend-deployment -n backend --timeout=5m
                kubectl rollout status deployment/frontend-deployment -n frontend --timeout=5m
                
                echo "Validating pod database and cache connectivity..."
                FRONTEND_POD=$(kubectl get pods -n frontend -l app.kubernetes.io/name=frontend -o jsonpath='{.items[0].metadata.name}')
                echo "Selected frontend pod: $FRONTEND_POD"
                
                RESPONSE=$(kubectl exec -n frontend "pod/$FRONTEND_POD" -- curl -s http://backend-service.backend.svc.cluster.local:8000/api/v1/readiness)
                echo "Readiness response: $RESPONSE"
                
                if [[ $RESPONSE != *"\"status\":\"ready\""* || $RESPONSE != *"\"database\":\"connected\""* || $RESPONSE != *"\"redis\":\"connected\""* ]]; then
                  echo "Error: Application readiness check failed or PostgreSQL/Redis connectivity is offline!"
                  exit 1
                fi
                echo "All post-deployment checks successfully passed!"