name: Enterprise IT Operations Automation Platform CI

# ############## WHEN THIS PIPELINE RUNS ##################
# Run on pushes and pull requests targeting master or feature branches,
# or start it manually from the GitHub Actions page.
on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master
      - 'feature/**'
  workflow_dispatch:

# Prevent overlapping runs for the same branch; keep the newest run active.
concurrency: 
  group: ci-${{ github.workflow }}-${{github.ref}}
  cancel-in-progress: true

# Skip entire workflow if commit message contains [skip ci] or [ci skip]
# Allows tearing down infrastructure without triggering rebuild
# Example: git commit -m "chore: tear down infra [skip ci]"
if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

jobs:
    # ############## STAGE 1: BACKEND QUALITY AND TESTS ##################
    # Start PostgreSQL and Redis, then check and test the backend application.
    backend:
        permissions:
            contents: read
        timeout-minutes: 20
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: ${{ vars.PS_USER || 'postgres' }}
                    POSTGRES_PASSWORD: ${{ vars.PS_PWD || 'postgres' }}
                    POSTGRES_DB: ${{ vars.DB_NAME || 'eitoap' }}
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            APP_NAME: ${{ vars.APP_NAME || 'Enterprise IT Operations Automation Platform' }}
            APP_VERSION: ${{ vars.APP_VERSION || '0.1.0' }}
            ENVIRONMENT: ci
            DEBUG: ${{ vars.DEBUG || 'true' }}
            HOST: ${{ vars.HOST || '0.0.0.0' }}
            PORT: ${{ vars.PORT || '8000' }}
            OTP_LENGTH: ${{ vars.OTP_LENGTH || '6' }}
            OTP_EXPIRY_MINUTES: ${{ vars.OTP_EXPIRY_MINUTES || '5' }}
            OTP_MAX_ATTEMPTS: ${{ vars.OTP_MAX_ATTEMPTS || '3' }}
            DATABASE_URL: postgresql://${{ vars.PS_USER || 'postgres' }}:${{ vars.PS_PWD || 'postgres' }}@localhost:5432/${{ vars.DB_NAME || 'eitoap' }}
            REDIS_URL: redis://localhost:6379/0
            REDIS_HOST: localhost
            REDIS_PORT: 6379
            REDIS_DB: 0
            REDIS_PASSWORD: ""
            JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
            JWT_ALGORITHM: HS256
            JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
            NOTIFICATION_PROVIDER: console
            AUTH_PROVIDER: local
            # SMS Mock Provider (od2.in) — used by live integration tests only
            SMS_BASE_URL: ${{ secrets.SMS_BASE_URL || 'https://od2.in/api/sms' }}
            SMS_ACCOUNT_SID: ${{ secrets.SMS_ACCOUNT_SID }}
            SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
            SMS_SENDER_ID: ${{ secrets.SMS_SENDER_ID || '+15551234567' }}
            SMS_TEST_RECIPIENT: ${{ secrets.SMS_TEST_RECIPIENT || '+18005550199' }}
            LIVE_SMS_TEST_ENABLED: ${{ secrets.SMS_ACCOUNT_SID != '' && 'true' || 'false' }}
            RUN_LIVE_SMS_TESTS: ${{ vars.RUN_LIVE_SMS_TESTS || 'false' }}


        name: Backend Build
    
        defaults:
            run:
                working-directory: backend

        steps:
            # Step 1: Get the repository source code.
            - name: Checkout_code
              uses: actions/checkout@v4

            # Step 2: Install the Python version used by the backend.
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: backend/requirements-test.txt
                  
            # Step 3: Install pinned backend test dependencies.
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip==26.1.2
                pip install --require-hashes -r requirements-test.txt
                pip install -r requirements-functions.txt azure-keyvault-secrets==4.8.0
                
            # Step 4: Check Python code quality with Ruff.
            - name: Run Ruff
              run: |
                    ruff check .    
      
            # Step 5: Ensure Python files follow Black formatting.
            - name: Check Formattting
              run: |
                    black --check .
           
            # Step 6: Verify Python import ordering.
            - name: Check Import Order (isort)
              run: |
                    isort --check .

            # Step 7: Scan backend code for common security issues.
            - name: Run Bandit Security scan
              run: |
                    bandit -r app -f json -o bandit-report.json
               
            # Step 8: Wait until the PostgreSQL and Redis services are reachable.
            - name: Verify Service Connectivity (Postgres & Redis)
              run: |
                    PYTHONPATH=. python scripts/wait_for_services.py

            # Step 9: Run the backend test suite, excluding the live SMS integration test.
            - name: Run Backend tests (pytest)
              run: |
                    pytest --junitxml=junit.xml --ignore=tests/integration/test_sms_integration.py

            # Step 10: Run the live SMS integration test only when explicitly enabled and credentials are configured.
            - name: Run Live SMS Integration Tests (od2.in mock provider)
              if: ${{ env.SMS_ACCOUNT_SID != '' && env.LIVE_SMS_TEST_ENABLED == 'true' && env.RUN_LIVE_SMS_TESTS == 'true' }}
              run: |
                    pytest tests/integration/test_sms_integration.py -v --junitxml=junit-sms.xml

            # Step 11: Confirm the FastAPI application imports successfully.
            - name: Validate FastAPI app
              run: |
                python -c "from app.main import app"

            # Steps 12-16: Upload test, coverage, and security reports even after failures.
            - name: Upload Pytest JUnit XML Report
              uses: actions/upload-artifact@v4
              with:
                name: pytest-junit-xml
                path: backend/junit.xml
              if: always()

            - name: Upload SMS Integration Test JUnit XML Report
              uses: actions/upload-artifact@v4
              with:
                name: pytest-sms-junit-xml
                path: backend/junit-sms.xml
              if: always()

            - name: Upload Coverage XML Report
              uses: actions/upload-artifact@v4
              with:
                name: coverage-xml
                path: backend/coverage/coverage.xml
              if: always()

            - name: Upload Coverage HTML Report
              uses: actions/upload-artifact@v4
              with:
                name: coverage-html
                path: backend/coverage/html/
              if: always()

            - name: Upload Bandit Report
              uses: actions/upload-artifact@v4
              with:
                name: bandit-report
                path: backend/bandit-report.json
              if: always()

    # ############## STAGE 2: FRONTEND QUALITY AND BUILD ##################
    # Install frontend dependencies, run checks, and build the React app.
    frontend:
        permissions:
            contents: read
        name: Frontend Build
        timeout-minutes: 20
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend
            
        steps:
            # Step 1: Get the repository source code.
            - name: Checkout repository
              uses: actions/checkout@v4
              
            # Step 2: Set up Node.js and cache npm dependencies.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22" 
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
             
            # Step 3: Install the exact dependencies recorded in package-lock.json.
            - name: Install dependencies
              run: npm ci --ignore-scripts --legacy-peer-deps

            # Step 4: Report high-severity dependency advisories without failing this job.
            - name: Audit frontend dependencies
              run: npm audit --audit-level=high
              continue-on-error: true

            # Step 5: Check frontend code with ESLint.
            - name: Run ESLint
              run: npm run lint

            # Step 6: Type-check the frontend without emitting files.
            - name: TypeScript validation
              run: npx tsc --noEmit

            # Step 7: Build the production React application.
            - name: Build react app
              run: npm run build

    ops-assistant-ui:
        permissions:
            contents: read
        name: AI Ops Assistant UI Build
        timeout-minutes: 20
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ops-assistant-ui

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: ops-assistant-ui/package-lock.json

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build assistant UI
              run: npm run build

    # ############## STAGE 3: SEMGREP SECURITY SCAN ##################
    # Runs after both application jobs pass.
    Semgrep:
        permissions:
            contents: read
        name: Semgrep security scan
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
            
        needs:
            - backend
            - frontend
            - ops-assistant-ui

        steps:
            # Step 1: Get the repository source code.
            - name: Checkout repository
              uses: actions/checkout@v4

            # Step 2: Run Semgrep CI rules against the repository.
            - name: Run Semgrep Scan
              run: semgrep ci
              env:
                  SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    # ############## STAGE 4: HELM CHART VALIDATION ##################
    # Lint charts and render manifests using development values.
    helm:
        permissions:
            contents: read
        name: Helm Lint
        runs-on: ubuntu-latest
        steps:
            # Step 1: Get the repository source code.
            - name: Checkout repository
              uses: actions/checkout@v4

            # Step 2: Install the Helm CLI version used by this pipeline.
            - name: Install Helm
              uses: azure/setup-helm@v4
              with:
                version: 'v3.14.0'

            # Step 3: Check each chart for Helm errors and best-practice issues.
            - name: Lint Helm Charts
              run: |
                helm lint deploy/helm/common
                helm lint deploy/helm/backend
                helm lint deploy/helm/frontend

            # Step 4: Render each chart to verify its development manifests.
            - name: Template Helm Charts (Dry Run)
              run: |
                helm template common deploy/helm/common -f deploy/helm/values/dev.yaml
                helm template backend deploy/helm/backend -f deploy/helm/values/dev.yaml
                helm template frontend deploy/helm/frontend -f deploy/helm/values/dev.yaml

    # ############## STAGE 5: TERRAFORM VALIDATION ##################
    # Cache providers, check formatting, and validate both environments.
    terraform:
        permissions:
            contents: read
        name: Terraform Validation
        runs-on: ubuntu-latest
        env:
            TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
        steps:
            # Step 1: Get the repository source code.
            - name: Checkout repository
              uses: actions/checkout@v4

            # Step 2: Install the Terraform CLI version used by this pipeline.
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: 1.9.0

            # Step 3: Create the local directory used to cache Terraform providers.
            - name: Create Terraform plugin cache directory
              run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

            # Step 4: Restore or save downloaded providers to speed up later runs.
            - name: Cache Terraform providers
              uses: actions/cache@v4
              with:
                path: ${{ env.TF_PLUGIN_CACHE_DIR }}
                key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
                restore-keys: |
                  terraform-providers-${{ runner.os }}-

            # Step 5: Check formatting across Terraform configuration files.
            - name: Format Check
              run: terraform fmt -check -recursive infrastructure/terraform

            # Steps 6-7: Initialize without a backend, then validate dev and prod.
            - name: Init and Validate Dev
              run: |
                cd infrastructure/terraform/environments/dev
                terraform init -backend=false -upgrade
                terraform validate

            - name: Init and Validate Prod
              run: |
                cd infrastructure/terraform/environments/prod
                terraform init -backend=false -upgrade
                terraform validate

    # ############## STAGE 6: BUILD AND PUBLISH CONTAINER IMAGES ##################
    # Build both images after validation; push to ACR only for master pushes.
    docker:
        permissions:
            contents: read
            id-token: write
        name: Docker build
        runs-on: ubuntu-latest
        needs:
            - backend
            - frontend
            - Semgrep
            - helm
            - terraform
        
        steps:
        
          # Step 1: Get the repository source code.
            - name: Checkout repository
              uses: actions/checkout@v4


          # Step 2: Enable Docker Buildx for image builds.
            - name: Setup up Docker buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f


          # Steps 3-4: Create image tags and build the backend and frontend images.
            - name: Docker metadata (Back-end)
              id: backend-meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
              with:
                images: entreprise-backend
                tags: |
                  type=raw,value=latest
                  type=ref,event=branch
                  type=sha


            - name: Build back-end image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
              with: 
                context: ./backend
                push: false
                load: true
                tags: ${{ steps.backend-meta.outputs.tags }}
                labels: ${{ steps.backend-meta.outputs.labels}}
                cache-from: type=gha
                cache-to: type=gha,mode=max

            - name: Docker metadata (Front-end)
              id: frontend-meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
              with:
                images: entreprise-frontend
                tags: |
                  type=raw,value=latest
                  type=ref,event=branch
                  type=sha
            
            
            
            - name: Build front-end image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
              with: 
                context: ./frontend
                push: false
                load: true
                tags: ${{steps.frontend-meta.outputs.tags}}
                labels: ${{steps.frontend-meta.outputs.labels}}
                cache-from: type=gha
                cache-to: type=gha,mode=max

            # Steps 5-7: On master pushes only, authenticate to Azure and push both images.
            - name: Azure Login
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Log in to Azure Container Registry
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              run: |
                az acr login --name ${{ vars.ACR_NAME || 'enterpriseitoperationsplatformdev1bab46e1' }}

            - name: Tag and Push images to ACR
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              run: |
                REGISTRY="${{ vars.ACR_LOGIN_SERVER || 'enterpriseitoperationsplatformdev1bab46e1.azurecr.io' }}"
                
                # Tag and Push Backend
                docker tag entreprise-backend:latest $REGISTRY/backend:latest
                docker tag entreprise-backend:latest $REGISTRY/backend:${{ github.sha }}
                docker push $REGISTRY/backend:latest
                docker push $REGISTRY/backend:${{ github.sha }}
                
                # Tag and Push Frontend
                docker tag entreprise-frontend:latest $REGISTRY/frontend:latest
                docker tag entreprise-frontend:latest $REGISTRY/frontend:${{ github.sha }}
                docker push $REGISTRY/frontend:latest
                docker push $REGISTRY/frontend:${{ github.sha }}

            # Steps 8-11: Save both built images and upload them for downstream scanning.
            - name: Save backend image
              run: |
               docker save \
                -o backend-image.tar \
                entreprise-backend:latest
              

            - name: Save frontend image
              run: |
               docker save \
               -o frontend-image.tar \
               entreprise-frontend:latest 

            - name: Upload back-end image
              uses: actions/upload-artifact@v4
              with: 
                name: backend-image
                path: backend-image.tar
                retention-days: 7

            - name: upload front-end image
              uses: actions/upload-artifact@v4
              with:
                name: frontend-image
                path: frontend-image.tar
                retention-days: 7

    # ############## STAGE 7: SIGN CONTAINER IMAGES ##################
    # On master/main pushes, sign the ACR images when a signing key is configured.
    sign:
      permissions:
        contents: read
        id-token: write
      name: Cosign Image Signing
      runs-on: ubuntu-latest
      needs: docker
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      steps:
        # Step 1: Get the repository source code.
        - name: Checkout repository
          uses: actions/checkout@v4

        # Step 2: Check for the signing secret; skip signing if it is not configured.
        - name: Check signing key
          id: signing-key
          env:
            COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          run: |
            if [ -n "$COSIGN_PRIVATE_KEY" ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Cosign Image Signing::COSIGN_PRIVATE_KEY secret is not set - skipping image signing"
            fi

        # Steps 3-4: Authenticate and install Cosign, only when a key is available.
        - name: Azure Login
          if: steps.signing-key.outputs.available == 'true'
          uses: azure/login@v2
          with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        - name: Log in to Azure Container Registry
          if: steps.signing-key.outputs.available == 'true'
          run: |
            az acr login --name ${{ vars.ACR_NAME || 'enterpriseitoperationsplatformdev1bab46e1' }}

        - name: Install Cosign
          if: steps.signing-key.outputs.available == 'true'
          run: |
            curl -sLO https://github.com/sigstore/cosign/releases/download/v2.2.2/cosign-linux-amd64
            chmod +x cosign-linux-amd64
            sudo mv cosign-linux-amd64 /usr/local/bin/cosign

        # Step 5: Decode or prepare the key and verify it is a valid private key.
        - name: Prepare cosign key
          if: steps.signing-key.outputs.available == 'true'
          env:
            COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          run: |
            printf '%s' "$COSIGN_PRIVATE_KEY" | base64 -d > cosign.key 2>/dev/null || true
            if ! grep -q "PRIVATE KEY" cosign.key; then
              printf '%s\n' "$COSIGN_PRIVATE_KEY" > cosign.key
            fi
            chmod 600 cosign.key
            if ! grep -q "PRIVATE KEY" cosign.key; then
              echo "::error::COSIGN_PRIVATE_KEY is neither valid base64 nor a PEM private key"
              exit 1
            fi

        # Steps 6-9: Sign both images and upload their signatures when signing is enabled.
        - name: Sign Backend Image
          if: steps.signing-key.outputs.available == 'true'
          env:
            COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          run: |
            cosign sign --key cosign.key --output-signature backend.sig \
              ${{ vars.ACR_LOGIN_SERVER || 'enterpriseitoperationsplatformdev1bab46e1.azurecr.io' }}/backend:${{ github.sha }}

        - name: Sign Frontend Image
          if: steps.signing-key.outputs.available == 'true'
          env:
            COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          run: |
            cosign sign --key cosign.key --output-signature frontend.sig \
              ${{ vars.ACR_LOGIN_SERVER || 'enterpriseitoperationsplatformdev1bab46e1.azurecr.io' }}/frontend:${{ github.sha }}

        - name: Upload Backend Signature
          if: steps.signing-key.outputs.available == 'true'
          uses: actions/upload-artifact@v4
          with:
            name: backend-signature
            path: backend.sig
            retention-days: 30
            if-no-files-found: error

        - name: Upload Frontend Signature
          if: steps.signing-key.outputs.available == 'true'
          uses: actions/upload-artifact@v4
          with:
            name: frontend-signature
            path: frontend.sig
            retention-days: 30
            if-no-files-found: error

        # Step 10: Remove the temporary signing key, including on failure.
        - name: Clean up cosign key
          if: always() && steps.signing-key.outputs.available == 'true'
          run: rm -f cosign.key

    # ############## STAGE 8: IMAGE SECURITY SCANS AND SBOMS ##################
    # Scan source and built images, publish reports, and generate SBOM artifacts.
    trivy:
        permissions:
            contents: read
            security-events: write
            id-token: write
        name: Trivy security scan
        needs: docker
        runs-on: ubuntu-latest

        steps:
            # Step 1: Get the repository source code.
            - name: Checkout code
              uses: actions/checkout@v4

            # Step 2: Scan repository files for critical vulnerabilities and secrets.
            - name: Run Trivy Filesystem Scan (Vulnerabilities & Secrets)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with:
                scan-type: 'fs'
                scan-ref: '.'
                format: 'table'
                exit-code: 1
                ignore-unfixed: true
                severity: 'CRITICAL'

            # Steps 3-6: Download the images produced above and load them into Docker.
            - name: Download back-end image
              uses: actions/download-artifact@v4 
              with: 
                name: backend-image
            
            - name: Download front-end image
              uses: actions/download-artifact@v4
              with: 
                name: frontend-image

            - name: Load back-end image
              run: docker load -i backend-image.tar

            - name: Load front-end image
              run: docker load -i frontend-image.tar

            - name: verify images
              run: docker images

            # Steps 7-8: Report high/critical findings for both images as SARIF.
            - name: Scan backend image (HIGH & CRITICAL Report)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with:
                image-ref: entreprise-backend:latest
                format: sarif
                output: backend-trivy-results.sarif
                exit-code: 0
                ignore-unfixed: true
                vuln-type: os,library
                severity: HIGH,CRITICAL

            - name: Scan frontend image (HIGH & CRITICAL Report)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with:
                image-ref: entreprise-frontend:latest
                format: sarif
                output: frontend-trivy-results.sarif
                exit-code: 0
                ignore-unfixed: true
                vuln-type: os,library
                severity: HIGH,CRITICAL

            # Steps 9-10: Fail the job if either image has an unfixed critical vulnerability.
            - name: Fail backend image on Critical vulnerability
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with:
                image-ref: entreprise-backend:latest
                format: table
                exit-code: 1
                ignore-unfixed: true
                vuln-type: os,library
                severity: CRITICAL

            - name: Fail frontend image on Critical vulnerability
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with:
                image-ref: entreprise-frontend:latest
                format: table
                exit-code: 1
                ignore-unfixed: true
                vuln-type: os,library
                severity: CRITICAL

            # Steps 11-12: Upload scan findings to GitHub code scanning.
            - name: Upload backend SARIF
              uses: github/codeql-action/upload-sarif@v4
              continue-on-error: true
              with:
                sarif_file: backend-trivy-results.sarif
                category: backend-trivy

            - name: Upload frontend SARIF
              uses: github/codeql-action/upload-sarif@v4
              continue-on-error: true
              with:
                sarif_file: frontend-trivy-results.sarif
                category: frontend-trivy
                
            # Steps 13-14: Generate CycloneDX SBOM files for both images.
            - name: Generate Backend SBOM
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with:
                image-ref: entreprise-backend:latest
                format: cyclonedx
                output: backend-sbom.json
                scanners: vuln
              
            - name: Generate Frontend SBOM
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
              with: 
                image-ref: entreprise-frontend:latest
                format: cyclonedx
                output: frontend-sbom.json
                scanners: vuln

            # Steps 15-17: Upload both SBOMs and retain the SARIF reports as artifacts.
            - name: Upload Backend SBOM
              uses: actions/upload-artifact@v4
              with: 
                name: backend-sbom
                path: backend-sbom.json
                retention-days: 30

            - name: Upload Frontend SBOM
              uses: actions/upload-artifact@v4
              with: 
                name: frontend-sbom
                path: frontend-sbom.json
                retention-days: 30

            - name: Upload Trivy SARIF Reports
              uses: actions/upload-artifact@v4
              with:
                name: trivy-sarif-reports
                path: |
                  backend-trivy-results.sarif
                  frontend-trivy-results.sarif
              if: always()

    # ############## STAGE 9: UPDATE GITOPS DESIRED STATE ##################
    # For eligible master pushes, update Helm values with the new image tag
    # and commit the change for Argo CD to deploy.
    update-gitops:
        permissions:
            contents: write
        name: Update GitOps image tags
        runs-on: ubuntu-latest
        needs:
            - docker
            - trivy
            - sign
        if: >-
            github.event_name == 'push' &&
            github.ref == 'refs/heads/master' &&
            !startsWith(github.event.head_commit.message, 'chore(gitops): deploy ')
        
        steps:
            # Step 1: Get the repository source code.
            - name: Checkout repository
              uses: actions/checkout@v4

            # Step 2: Write this commit's SHA as the image version in dev values.
            - name: Update declared image versions
              run: |
                python scripts/update-gitops-image-tags.py \
                  "${GITHUB_SHA}" \
                  deploy/helm/values/dev.yaml

            # Step 3: Commit and push the updated desired state only if it changed.
            - name: Commit desired state for Argo CD
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                if git diff --quiet -- deploy/helm/values/dev.yaml; then
                  echo "Image tags already match this commit."
                  exit 0
                fi
                git add deploy/helm/values/dev.yaml
                git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
                git push origin "HEAD:${GITHUB_REF_NAME}"
