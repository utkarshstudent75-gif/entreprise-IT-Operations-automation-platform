<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b57d0" />
    <meta name="description" content="Secure self-service password recovery for Enterprise IT Operations." />
    <title>Enterprise IT Operations Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('root');
        if (el && (!el.children || el.children.length === 0)) {
          var errDiv = document.createElement('div');
          errDiv.style = "margin: 30px auto; max-width: 600px; padding: 24px; background: #fff1f0; border: 1px solid #ffa39e; border-radius: 8px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; color: #cf1322;";
          errDiv.innerHTML = "<h3 style='margin-top:0'>UI Rendering Error</h3><p>An unexpected error occurred while loading the application:</p><pre style='background:#fff;padding:12px;border:1px solid #ffccc7;border-radius:4px;overflow:auto;font-size:12px;'>" + (e.error ? (e.error.stack || e.error.message) : e.message) + "</pre>";
          document.body.appendChild(errDiv);
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('root');
        if (el && (!el.children || el.children.length === 0)) {
          var errDiv = document.createElement('div');
          errDiv.style = "margin: 30px auto; max-width: 600px; padding: 24px; background: #fff1f0; border: 1px solid #ffa39e; border-radius: 8px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; color: #cf1322;";
          errDiv.innerHTML = "<h3 style='margin-top:0'>Unhandled Promise Rejection</h3><p>A promise rejection was not caught:</p><pre style='background:#fff;padding:12px;border:1px solid #ffccc7;border-radius:4px;overflow:auto;font-size:12px;'>" + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : e) + "</pre>";
          document.body.appendChild(errDiv);
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
