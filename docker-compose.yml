version: "3.9"

services:
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-api-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - TICKET_SERVICE_URL=http://ticket-service:8002
      - WORKFLOW_SERVICE_URL=http://workflow-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:8004
      - AUDIT_SERVICE_URL=http://audit-service:8005
      - ENABLE_REVERSE_PROXY=true
    depends_on:
      - auth-service
      - ticket-service
      - workflow-service
      - notification-service
      - audit-service
      - postgres
      - redis
    restart: unless-stopped

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-auth-service
    command: uvicorn services.auth_service.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  ticket-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-ticket-service
    command: uvicorn services.ticket_service.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    restart: unless-stopped

  workflow-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-workflow-service
    command: uvicorn services.workflow_service.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-notification-service
    command: uvicorn services.notification_service.main:app --host 0.0.0.0 --port 8004
    ports:
      - "8004:8004"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    restart: unless-stopped

  audit-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-audit-service
    command: uvicorn services.audit_service.main:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: enterprise-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_PROXY_TARGET=http://api-gateway:8000
    depends_on:
      - api-gateway
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: enterprise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eitoap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: enterprise-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eitoap.local
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    container_name: enterprise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
