  <path d="M842 369 L842 403 L783 403 L783 412" class="gitops"/>
  <path d="M842 369 L842 403 L1058 403 L1058 412" class="gitops"/>
  <text x="862" y="396" class="tiny">sync charts</text>

  <rect x="500" y="158" width="132" height="39" rx="10" fill="#fff" stroke="#b8c8f2"/>
  <text x="518" y="183" class="small">User browser</text>
  <path d="M500 178 L480 178 L480 396 L566 396 L566 412" class="line"/>
  <path d="M635 472 L672 472" class="line"/>
  <text x="639" y="457" class="tiny">web UI</text>
  <path d="M635 510 C635 565 1058 565 1058 532" class="line"/>
  <text x="793" y="558" class="tiny">/api requests</text>

  <path d="M1181 450 C1235 450 1238 407 1272 407" class="line"/>
  <path d="M1181 475 C1245 475 1238 542 1272 542" class="line"/>
  <text x="1194" y="437" class="tiny">SQL</text>
  <text x="1200" y="510" class="tiny">cache</text>
  <path d="M1280 677 C1240 677 1232 530 1187 510" class="gitops"/>
  <text x="1190" y="629" class="tiny">secret access</text>

  <path d="M1058 528 C1058 667 670 667 670 737" class="monitor"/>
  <text x="794" y="683" class="tiny">/metrics</text>
  <path d="M842 659 C842 700 684 700 684 737" class="monitor"/>
  <text x="732" y="722" class="tiny">cluster metrics</text>
  <path d="M798 800 L858 800" class="line"/>
  <text x="806" y="786" class="tiny">dashboards</text>
</svg>
