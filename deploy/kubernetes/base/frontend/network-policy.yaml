apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: frontend
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound traffic on port 8080 from any source (via ingress)
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS requests (typically UDP/TCP port 53 to kube-system)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress TCP traffic to backend pods on port 8000
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 8000
