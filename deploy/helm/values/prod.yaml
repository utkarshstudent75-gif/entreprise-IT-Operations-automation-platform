# Prod Environment Overrides (AKS Prod Cluster)
# Shared configuration passed to all Helm charts

namespace: prod

image:
  repository: enterpriseitoperationsplatformdev397741ac.azurecr.io/backend
  tag: latest
  pullPolicy: Always

# Frontend Chart Overrides
frontend:
  image:
    repository: enterpriseitoperationsplatformdev397741ac.azurecr.io/frontend
    tag: latest
    pullPolicy: Always
  ingress:
    enabled: true
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/use-regex: "true"
    # Route configuration
    backendService: backend-service
    backendPort: 8000

# Backend Chart Overrides
backend:
  replicaCount: 3
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
  pdb:
    enabled: true
    minAvailable: 2

# Database/Cache Settings (Prod Azure resources)
redis:
  enabled: false
  host: "enterprise-it-operations-platform-dev-redis.redis.cache.windows.net"
  port: 6380
  db: 0

# App Configuration
config:
  environment: "production"
  debug: "false"
  notificationProvider: "sms"
  smsBaseUrl: "https://od2.in/api/sms/send"
  smsSenderId: "+1234567890"
  smsTimeoutSeconds: 5.0
  smsRetryCount: 3
  authProvider: "local"
  jwtAlgorithm: "HS256"
  jwtAccessTokenExpireMinutes: 1440
  viteApiBaseUrl: "/api/v1"

# Database & Redis connection secrets
secrets:
  databaseUrl: "CHANGE_ME_DATABASE_URL"
  redisUrl: "CHANGE_ME_REDIS_URL"
  jwtSecretKey: "secret-key-change-in-production-prod"
  smsApiKey: "placeholder-sms-api-key"
  smsAccountSid: "placeholder-sms-account-sid"
