# Dev Environment Overrides (AKS Dev Cluster)
# Shared configuration passed to all Helm charts
image:
  repository: enterpriseitoperationsplatformdev397741ac.azurecr.io/backend
  tag: latest
  pullPolicy: Always

# Frontend Chart Overrides
frontend:
  image:
    repository: enterpriseitoperationsplatformdev397741ac.azurecr.io/frontend
    tag: latest
    pullPolicy: Always
  ingress:
    enabled: true
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/use-regex: "true"
    # Route configuration
    backendService: backend-service
    backendPort: 8000

# Backend Chart Overrides
backend:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
  pdb:
    enabled: true
    minAvailable: 1

# Database/Cache Settings (Dev Azure resources)
redis:
  enabled: false # Connect to Azure Cache for Redis instead of in-cluster Redis
  host: "enterprise-it-operations-platform-dev-redis.redis.cache.windows.net"
  port: 6380
  db: 0

# App Configuration
config:
  environment: "development"
  debug: "true"
  notificationProvider: "sms"
  smsBaseUrl: "https://od2.in/api/sms/send"
  smsSenderId: "+1234567890"
  smsTimeoutSeconds: 5.0
  smsRetryCount: 3
  authProvider: "local"
  jwtAlgorithm: "HS256"
  jwtAccessTokenExpireMinutes: 1440
  viteApiBaseUrl: "/api/v1"

# Database & Redis connection secrets (referencing Azure PostgreSQL & Azure Cache for Redis)
secrets:
  databaseUrl: "CHANGE_ME_DATABASE_URL"
  redisUrl: "CHANGE_ME_REDIS_URL"
  jwtSecretKey: "secret-key-change-in-production-dev"
  smsApiKey: "placeholder-sms-api-key"
  smsAccountSid: "placeholder-sms-account-sid"
