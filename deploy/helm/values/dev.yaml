# Dev Environment Overrides (AKS Dev Cluster)
# Shared configuration passed to all Helm charts
image:
  repository: enterpriseitoperationsplatformdev1bab46e1.azurecr.io/backend
  tag: 06722c83be73e7c0b6a7b7d420d2fbb09d903f04
  pullPolicy: Always

# Frontend Chart Overrides
frontend:
  image:
    repository: enterpriseitoperationsplatformdev1bab46e1.azurecr.io/frontend
    tag: 06722c83be73e7c0b6a7b7d420d2fbb09d903f04
    pullPolicy: Always
  ingress:
    enabled: true
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/use-regex: "true"
    # Route configuration
    backendService: backend-service
    backendPort: 8000

# Backend Chart Overrides
backend:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
  pdb:
    enabled: true
    minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  backendNamespace: backend

# Database/Cache Settings (Dev Azure resources)
redis:
  enabled: false # Connect to Azure Cache for Redis instead of in-cluster Redis
  host: "enterprise-it-operations-platform-dev-redis-1bab46e1.redis.cache.windows.net"
  port: 6380
  db: 0

# App Configuration
config:
  environment: "development"
  debug: "true"
  notificationProvider: "sms"
  smsBaseUrl: "https://od2.in/api/sms/send"
  smsSenderId: "+15551234567"
  smsTimeoutSeconds: 5.0
  smsRetryCount: 3
  # Dev uses the od2.in mock provider; OTPs for users without a phone number
  # in Entra ID are delivered to this shared test number.
  smsTestRecipient: "+18005550199"
  authProvider: "local"
  jwtAlgorithm: "HS256"
  jwtAccessTokenExpireMinutes: 1440
  viteApiBaseUrl: "/api/v1"
  # Load SMS/DB/Redis/Graph secrets from Azure Key Vault at startup.
  # Requires the pod identity to hold "Key Vault Secrets User" on the vault.
  keyvaultName: "enterprise-it-operations"

# Database & Redis connection secrets (referencing Azure PostgreSQL & Azure Cache for Redis)
secrets:
  databaseUrl: "postgresql://psqladmin:KWKa%21MGl%28m5%24UWgN@enterprise-it-operations-platform-dev-db-central-1bab46e1.postgres.database.azure.com:5432/eitoap?sslmode=require"
  redisUrl: "rediss://:knopcpuZM5npOhKtCMlpw402InawT9m2AAzCaDv6dAE%3D@enterprise-it-operations-platform-dev-redis-1bab46e1.redis.cache.windows.net:6380/0"
  jwtSecretKey: "secret-key-change-in-production-dev"
  smsApiKey: "<injected-from-azure-keyvault>"  # Secret: sms-api-key
  smsAccountSid: "<injected-from-azure-keyvault>"  # Secret: sms-account-sid
