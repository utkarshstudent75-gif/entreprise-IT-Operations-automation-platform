{{- if .Values.opsAssistant.enabled }}
{{- if not .Values.opsAssistant.clientId }}
{{- fail "backend.opsAssistant.clientId must be set when the Ops Assistant workload identity is enabled" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.opsAssistant.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.opsAssistant.clientId | quote }}
{{- end }}
