backend:
  namespace: backend
  appLabel: backend
  portName: http

prometheus:
  image: prom/prometheus:v3.5.0
  storage: 8Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

grafana:
  image: grafana/grafana:12.1.0
  admin:
    existingSecret: grafana-admin
    secretKey: admin-password
  storage: 1Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

kubeStateMetrics:
  image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
