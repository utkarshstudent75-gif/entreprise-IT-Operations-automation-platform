apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-storage
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: prometheus
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.prometheus.storageClassName }}
  storageClassName: {{ .Values.prometheus.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.prometheus.storage | quote }}
