apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: {{ .Values.backendNamespace }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_VERSION: {{ .Values.config.appVersion | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  DEBUG: {{ .Values.config.debug | quote }}
  HOST: {{ .Values.config.host | quote }}
  PORT: {{ .Values.config.port | quote }}
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  NOTIFICATION_PROVIDER: {{ .Values.config.notificationProvider | quote }}
  SMS_BASE_URL: {{ .Values.config.smsBaseUrl | quote }}
  SMS_SENDER_ID: {{ .Values.config.smsSenderId | quote }}
  SMS_TIMEOUT_SECONDS: {{ .Values.config.smsTimeoutSeconds | quote }}
  SMS_RETRY_COUNT: {{ .Values.config.smsRetryCount | quote }}
  # Fallback destination when a user has no business phone number in Entra ID
  SMS_TEST_RECIPIENT: {{ .Values.config.smsTestRecipient | default "" | quote }}
  AUTH_PROVIDER: {{ .Values.config.authProvider | quote }}
  JWT_ALGORITHM: {{ .Values.config.jwtAlgorithm | quote }}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.config.jwtAccessTokenExpireMinutes | quote }}
  # Optional: set to the Azure Key Vault name to load secrets at startup
  # using DefaultAzureCredential (Workload/Managed Identity).
  KEYVAULT_NAME: {{ .Values.config.keyvaultName | default "" | quote }}
  FOUNDRY_PROJECT_ENDPOINT: {{ .Values.config.opsAssistantFoundryProjectEndpoint | default "" | quote }}
  FOUNDRY_AGENT_NAME: {{ .Values.config.opsAssistantFoundryAgentName | default "" | quote }}
  OPS_AZURE_SUBSCRIPTION_ID: {{ .Values.config.opsAssistantAzureSubscriptionId | default "" | quote }}
  OPS_ASSISTANT_ALLOWED_ORIGINS: {{ .Values.config.opsAssistantAllowedOrigins | default "" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: {{ .Values.frontendNamespace }}
data:
  VITE_API_BASE_URL: {{ .Values.config.viteApiBaseUrl | quote }}
