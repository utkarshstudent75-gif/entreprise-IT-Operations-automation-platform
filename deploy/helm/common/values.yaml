namespace: database
backendNamespace: backend
frontendNamespace: frontend

config:
  appName: "Enterprise IT Operations Automation Platform"
  appVersion: "0.1.0"
  environment: "production"
  debug: false
  host: "0.0.0.0"
  port: 8000
  notificationProvider: "sms"
  smsBaseUrl: "https://od2.in/api/sms/send"
  smsSenderId: "+1234567890"
  smsTimeoutSeconds: 5.0
  smsRetryCount: 3
  # Fallback OTP destination when a user has no business phone number (empty = disabled)
  smsTestRecipient: ""
  authProvider: "local"
  jwtAlgorithm: "HS256"
  jwtAccessTokenExpireMinutes: 1440
  viteApiBaseUrl: "/api/v1"
  # Azure Key Vault name used to load secrets at startup (empty = use env vars only)
  keyvaultName: ""

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

secrets:
  databaseUrl: "postgresql://postgres:postgres@postgres-service:5432/eitoap"
  redisUrl: "redis://redis-service:6379/0"
  jwtSecretKey: "secret-key-change-in-production"
  smsApiKey: "CHANGE_ME_SMS_API_KEY"
  smsAccountSid: "CHANGE_ME_SMS_ACCOUNT_SID"
